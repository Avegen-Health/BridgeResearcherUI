language: node_js
sudo: false
script:
- nvm install 16.0.0
- nvm use 16.0.0
- npm install
- npm run test
- npm run release
deploy:
  matrix:
  - provider: s3
    edge: true
    bucket: research-staging.gvbridge.org
    region: us-west-2
    skip_cleanup: true
    acl: public_read
    detect_encoding: false
    local_dir: app
    on:
      branch: develop
  - provider: s3
    edge: true
    bucket: research.gvbridge.org
    region: us-west-2
    skip_cleanup: true
    acl: public_read
    detect_encoding: false
    local_dir: app
    on:
      branch: release
